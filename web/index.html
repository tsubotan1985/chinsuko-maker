<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ちんすこうメーカー</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--cellh:76px}
html{font-size:calc(100vw/39);height:100%}
@media (min-aspect-ratio:39/86){html{font-size:calc(100vh/86)}}
body{
  height:100%;overflow:hidden;
  font-family:"UD デジタル 教科書体 NK","UD Digi Kyokasho NK-R","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  background:#08040f;color:#fff;user-select:none;-webkit-user-select:none;
  touch-action:none;
}
#app{
  position:relative;height:100%;width:100%;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:
    radial-gradient(120% 60% at 50% 0%,#3a1160 0%,#1a0733 45%,#08040f 100%),
    #08040f;
  overflow:hidden;
}
/* ---- 背景のネオン街 ---- */
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(90deg,rgba(255,0,200,.14) 0 2px,transparent 2px 22px),
    radial-gradient(40% 30% at 12% 78%,rgba(0,240,255,.25),transparent 70%),
    radial-gradient(40% 30% at 88% 72%,rgba(255,120,0,.22),transparent 70%);
}
/* ================= 上部バー ================= */
#topbar{position:relative;z-index:3;padding:1.4rem 1.2rem .8rem;display:flex;flex-direction:column;gap:1rem}
.logo{
  font-size:3.05rem;font-weight:900;letter-spacing:.02em;line-height:1;text-align:center;
  background:linear-gradient(180deg,#fff3a8 0%,#ffd400 38%,#ff8a00 60%,#ff3d8b 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.42rem #2a0038;paint-order:stroke fill;
  filter:drop-shadow(0 0 .5rem #ff2ea6) drop-shadow(0 .25rem 0 #4b0060);
  animation:logoPulse 2.4s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.stat{
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(0,0,0,.45));
  border:.22rem solid rgba(255,255,255,.35);border-radius:1rem;
  padding:.55rem .3rem .45rem;text-align:center;box-shadow:0 .3rem 1rem rgba(0,0,0,.5) inset;
}
.stat b{display:block;font-size:2.15rem;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;
  font-family:"Menlo",monospace;color:#ffe87a;text-shadow:0 0 .7rem rgba(255,215,0,.8)}
.stat small{font-size:1.05rem;font-weight:700;opacity:.85;letter-spacing:.06em}
.stat.risk b{color:#ff7b9c;text-shadow:0 0 .7rem rgba(255,0,90,.9)}
.stat.coin b{color:#8ff0ff;text-shadow:0 0 .7rem rgba(0,240,255,.8)}
/* ================= 筐体 ================= */
#machine{position:relative;z-index:3;flex:1;display:flex;align-items:center;justify-content:center;padding:.6rem .8rem 0;min-height:0}
.frame{
  position:relative;width:100%;border-radius:1.7rem;padding:.72rem;
  box-shadow:0 1.2rem 3rem rgba(0,0,0,.75),0 0 2.4rem rgba(255,0,200,.45);
}
/* レインボー縁は擬似要素だけで描く（中身に色フィルタが乗らないように） */
.frame::before{
  content:"";position:absolute;inset:0;border-radius:1.7rem;
  background:conic-gradient(from 0deg,#ff004d,#ff8a00,#ffe600,#25ff64,#00e5ff,#4d5bff,#c400ff,#ff004d);
  animation:rainbowSpin 2.6s linear infinite;
}
@keyframes rainbowSpin{to{filter:hue-rotate(360deg)}}
.panel{
  position:relative;z-index:1;border-radius:1.05rem;padding:.9rem .8rem;
  background:linear-gradient(180deg,#1b0a2e,#0d0618 60%,#170a26);
  box-shadow:inset 0 0 1.6rem rgba(0,0,0,.75);
}
.lampline{display:flex;gap:.45rem;justify-content:center;margin-bottom:.8rem}
.lamp{width:.95rem;height:.95rem;border-radius:50%;background:#ff004d;box-shadow:0 0 .7rem #ff004d}
.lamp.o{background:#00e5ff;box-shadow:0 0 .7rem #00e5ff}
.lamp.y{background:#ffe600;box-shadow:0 0 .7rem #ffe600}
.lamp:nth-child(odd){animation:blink .7s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.22}}
#reels{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:.55rem}
.reel{
  position:relative;overflow:hidden;border-radius:.75rem;height:calc(var(--cellh)*3);
  background:linear-gradient(180deg,#fffdf8,#f7f0e6 50%,#e6dbc9);
  box-shadow:inset 0 .2rem .6rem rgba(0,0,0,.35),inset 0 -.9rem 1.2rem rgba(0,0,0,.28),0 0 .35rem rgba(0,0,0,.6);
  touch-action:none;
}
.reel .strip{position:absolute;inset:0}
/* 回転中に文字へ白い線を重ねると「透けて読めない」ので、速度線はやめて上下の陰だけにする */
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:20%;pointer-events:none;z-index:2}
.reel::before{top:0;background:linear-gradient(180deg,rgba(30,0,50,.34),rgba(30,0,50,0))}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(30,0,50,.34),rgba(30,0,50,0))}
/* コマは1枚ずつ配置する（帯の端で空白が出ないように） */
.cell{
  position:absolute;left:0;right:0;top:0;height:var(--cellh);padding:.14rem;
}
.tile{
  width:100%;height:100%;border-radius:.42rem;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 .12rem 0 rgba(255,255,255,.8),0 .12rem .28rem rgba(60,20,90,.22);
}
.tile .kana{font-size:calc(var(--cellh)*.44);font-weight:900;color:#2b0b3d;line-height:1;
  text-shadow:0 .1rem 0 rgba(255,255,255,.7)}
.tile.happy{box-shadow:inset 0 .12rem 0 rgba(255,255,255,.9),0 .12rem .5rem rgba(190,130,0,.65)}
.tile.happy .kana{color:#7a3c00}
/* 当たりライン */
#line{position:absolute;display:none;z-index:5;left:0;top:0;width:0;height:0;border-radius:.4rem;pointer-events:none;
  transition:left .12s ease,width .12s ease,top .12s ease}
#line.on{display:block;animation:lineFlash .35s steps(1,end) infinite;border:.28rem solid #ffea00;box-shadow:0 0 1.4rem #ffea00,0 0 2.6rem #ff5e00 inset}
#line.risk.on{border-color:#ff2d55;box-shadow:0 0 1.4rem #ff2d55,0 0 2.6rem #ff2d55 inset}
#line.normal.on{border-color:#7ef0ff;box-shadow:0 0 .9rem #7ef0ff}
@keyframes lineFlash{0%,49%{opacity:1}50%,100%{opacity:.35}}
#runline{position:absolute;left:.8rem;right:.8rem;height:.28rem;background:linear-gradient(90deg,transparent,#ff3d8b,#ffe600,#3df0ff,transparent);opacity:0}
#runline.on{opacity:1;animation:runUp 1.1s linear infinite}
@keyframes runUp{0%{top:0}100%{top:100%}}
/* ================= 演出帯 ================= */
#stage{position:relative;z-index:3;height:14rem;padding:.7rem 1.2rem 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.5rem}
#reach{
  font-size:2.9rem;font-weight:900;letter-spacing:.14em;color:#fff;
  -webkit-text-stroke:.34rem #ff004d;paint-order:stroke fill;
  text-shadow:0 0 .45rem #fff,0 0 1.3rem #ff2ea6,0 .22rem 0 #7a0030;
  display:none;
}
#reach.on{display:block;animation:reachZoom .34s ease-out infinite alternate}
@keyframes reachZoom{from{transform:scale(.94)}to{transform:scale(1.12)}}
#msg{font-size:1.75rem;font-weight:900;text-align:center;line-height:1.25;min-height:2.4rem;
  text-shadow:0 0 .8rem rgba(0,0,0,.9);opacity:.92}
#msg .hl{color:#ffe600}
#msg .hlr{color:#ff5470}
/* ================= レバー ================= */
#leverWrap{position:relative;z-index:3;padding:.4rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom))}
#lever{
  width:100%;height:9.2rem;border:0;border-radius:1.5rem;position:relative;
  font-family:inherit;font-size:3.1rem;font-weight:900;letter-spacing:.16em;color:#2a0016;
  background:linear-gradient(180deg,#ffe680 0%,#ffc107 40%,#ff7a00 78%,#d1005a 100%);
  box-shadow:0 .55rem 0 #6d0030,0 1rem 1.6rem rgba(0,0,0,.6),inset 0 .3rem 0 rgba(255,255,255,.6);
  text-shadow:0 .18rem 0 rgba(255,255,255,.55);
  transition:transform .06s,box-shadow .06s;
}
#lever:active{transform:translateY(.5rem);box-shadow:0 .1rem 0 #6d0030,0 .3rem .8rem rgba(0,0,0,.6),inset 0 .3rem 0 rgba(255,255,255,.5)}
#lever:disabled{filter:grayscale(.35) brightness(.8)}
#lever .sub{display:block;font-size:1.25rem;letter-spacing:.02em;font-weight:900;opacity:.75;margin-top:.15rem}
#mute{position:absolute;left:1.2rem;top:1.5rem;z-index:6;width:3.2rem;height:3.2rem;border-radius:50%;
  border:.2rem solid rgba(255,255,255,.45);background:rgba(0,0,0,.4);color:#fff;font-size:1.5rem;padding:0;line-height:1}
/* ================= 大演出 ================= */
#fx{position:absolute;inset:0;z-index:9;pointer-events:none}
#flash{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;background:#fff}
#flash.go{animation:flashAnim .55s ease-out}
@keyframes flashAnim{0%{opacity:1}100%{opacity:0}}
#flash.gold{background:radial-gradient(circle at 50% 45%,#fff 0%,#ffe259 35%,#ff9a00 65%,transparent 100%)}
#flash.rb{background:conic-gradient(from 0deg,#ff004d,#ff8a00,#ffe600,#25ff64,#00e5ff,#4d5bff,#c400ff,#ff004d)}
/* 当たり行が隠れないよう、大文字は少し上に寄せる */
#big{position:absolute;inset:0;z-index:11;pointer-events:none;display:flex;align-items:center;justify-content:center;padding-bottom:36rem}
#bigsvg{width:104%;height:auto;overflow:visible;opacity:0;transform:scale(.3) rotate(-8deg)}
#bigsvg.show{animation:bigIn .75s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes bigIn{
  0%{opacity:0;transform:scale(.25) rotate(-10deg)}
  45%{opacity:1;transform:scale(1.14) rotate(3deg)}
  62%{transform:scale(.98) rotate(-1.5deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
#bigsvg.hide{animation:bigOut .45s ease-in forwards}
@keyframes bigOut{to{opacity:0;transform:scale(1.5) rotate(6deg)}}
#bigsvg text{font-family:"UD デジタル 教科書体 NK","UD Digi Kyokasho NK-B","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:900;paint-order:stroke fill;stroke-linejoin:round;stroke-linecap:round}
#bigsvg.rb{filter:drop-shadow(0 0 .6rem #fff) drop-shadow(0 0 1.6rem #ff00d0) drop-shadow(0 0 3rem #00e5ff);animation:glowSpin 1.1s linear infinite}
@keyframes glowSpin{0%{filter:drop-shadow(0 0 .6rem #fff) drop-shadow(0 0 1.6rem #ff00d0) drop-shadow(0 0 3rem #00e5ff)}
  33%{filter:drop-shadow(0 0 .6rem #fff) drop-shadow(0 0 1.6rem #ffe600) drop-shadow(0 0 3rem #25ff64)}
  66%{filter:drop-shadow(0 0 .6rem #fff) drop-shadow(0 0 1.6rem #ff8a00) drop-shadow(0 0 3rem #4d5bff)}
  100%{filter:drop-shadow(0 0 .6rem #fff) drop-shadow(0 0 1.6rem #ff00d0) drop-shadow(0 0 3rem #00e5ff)}}
#bigsvg.au{filter:drop-shadow(0 0 1.1rem #ffd700) drop-shadow(0 0 2.8rem #ff2d55)}
#bigsvg.strobe{animation:bigIn .75s cubic-bezier(.2,1.7,.4,1) forwards,shakeHard .13s linear infinite .75s}
@keyframes shakeHard{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-.7rem,.4rem) rotate(-1.2deg)}
  50%{transform:translate(.6rem,-.5rem) rotate(1deg)}75%{transform:translate(-.4rem,-.3rem) rotate(-.6deg)}100%{transform:translate(0,0)}}
#app.shake{animation:shakeScreen .28s linear 3}
@keyframes shakeScreen{0%{transform:translate(0,0)}25%{transform:translate(-.5rem,.4rem)}50%{transform:translate(.5rem,-.3rem)}75%{transform:translate(-.3rem,-.4rem)}100%{transform:translate(0,0)}}
#app.riskyGlow{box-shadow:inset 0 0 6rem rgba(255,0,60,.75)}
#banner{position:absolute;left:0;right:0;bottom:12.3rem;z-index:11;pointer-events:none;text-align:center;opacity:0}
#banner.on{animation:bannerUp .5s ease-out forwards}
@keyframes bannerUp{from{opacity:0;transform:translateY(3rem)}to{opacity:1;transform:translateY(0)}}
#banner .b1{display:inline-block;font-size:2.3rem;font-weight:900;color:#fff;padding:.5rem 1.4rem;border-radius:.8rem;
  background:linear-gradient(90deg,#ff004d,#ff8a00,#ffe600,#25ff64,#00e5ff,#c400ff);
  box-shadow:0 0 1.6rem rgba(255,255,255,.8);-webkit-text-stroke:.16rem #22000f;paint-order:stroke fill}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">ちんすこうメーカー</div>
    <div class="stats">
      <div class="stat"><b id="sMade">0</b><small>つくった</small></div>
      <div class="stat risk"><b id="sRisk">0</b><small>ヤバさ</small></div>
      <div class="stat coin"><b id="sCoin">100</b><small>コイン</small></div>
    </div>
  </header>

  <div id="machine">
    <div class="frame" id="frame">
     <div class="panel">
      <div class="lampline">
        <div class="lamp"></div><div class="lamp o"></div><div class="lamp y"></div><div class="lamp"></div>
        <div class="lamp o"></div><div class="lamp y"></div><div class="lamp"></div><div class="lamp o"></div>
        <div class="lamp y"></div><div class="lamp"></div><div class="lamp o"></div><div class="lamp y"></div>
      </div>
      <div id="reels">
        <div id="line"></div>
        <div id="runline"></div>
      </div>
     </div>
    </div>
  </div>

  <div id="stage">
    <div id="reach">リ ー チ</div>
    <div id="msg">↕ フリックで まわす！ <span class="hl">ち・ん・す・こ・う</span> を そろえろ</div>
  </div>

  <div id="leverWrap">
    <button id="lever">ま わ せ<span class="sub">フリックでもOK</span></button>
  </div>
  <button id="mute">🔊</button>
</div>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="big">
  <svg id="bigsvg" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ff0000"/><stop offset=".16" stop-color="#ff8a00"/>
        <stop offset=".33" stop-color="#ffe600"/><stop offset=".5" stop-color="#25ff64"/>
        <stop offset=".66" stop-color="#00e5ff"/><stop offset=".83" stop-color="#4d5bff"/>
        <stop offset="1" stop-color="#c400ff"/>
        <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="1.6s" repeatCount="indefinite"/>
      </linearGradient>
      <linearGradient id="au" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffbe0"/><stop offset=".16" stop-color="#ffd700"/>
        <stop offset=".32" stop-color="#a87200"/><stop offset=".5" stop-color="#fff3b0"/>
        <stop offset=".68" stop-color="#e0a000"/><stop offset=".84" stop-color="#ffd700"/>
        <stop offset="1" stop-color="#7a4a00"/>
        <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="2.2s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
    <text id="bt1" x="500" y="270" text-anchor="middle" font-size="200" stroke="url(#rb)" stroke-width="26" fill="#ffffff" style="display:none">-</text>
    <g id="bigG"></g>
  </svg>
</div>
<div id="banner"><span class="b1" id="bannerTxt"></span></div>

<script>
/* =========================================================
   ちんすこうメーカー  /  5リール・スロット
   リールはフリック（上→下 / 下→上）で回転。
   当たりは抽選 → リールがその図柄で止まる（本物のパチスロと同じ制御）。
   ========================================================= */
/* リールに出る文字は「ち・ん・す・こ・う」の5種類だけ */
const CHARS='ちんすこう'.split('');
/* どのリールにも「ち・ん・す・こ・う」の5文字が全部入る。
   す（ちんすこう専用の文字）を少し出やすくして、偶然だけで危うい言葉が揃いすぎないようにしている */
const RSPEC={}; CHARS.forEach(c=>{ RSPEC[c]=(c==='す'?2:1); });
const REEL_SPEC=[0,1,2,3,4].map(()=>RSPEC);
const CHAR_BG={                                 // 見分けやすいよう淡い色を割り当てる
  'ち':'linear-gradient(180deg,#ffe9f2,#ffc4da)',
  'ん':'linear-gradient(180deg,#e8f2ff,#c2d9fb)',
  'す':'linear-gradient(180deg,#fff8d0,#ffd34f)',
  'こ':'linear-gradient(180deg,#e9fbe7,#bfe9bb)',
  'う':'linear-gradient(180deg,#f1ebff,#d6c8ff)',
};
const WORDS=[                // 5文字（ち・ん・す・こ・う）で作れる言葉だけが成立する（wt = 抽選の重み）
  // ※ この配列はアプリの動作に必要なデータなのでそのまま。文章（README/リリースノート）側は伏せている
  {w:'ちんすこう', kind:'happy', wt:0},      // ← 本線（レインボー）
  // --- 5文字：超ヤバい（マシマシ系。偶然揃う率はほぼ無視できるので演出を増やすのに最適）---
  {w:'ちんちんこ', kind:'risky', wt:0.6},
  {w:'ちんうんこ', kind:'risky', wt:0.6},
  {w:'うんちんこ', kind:'risky', wt:0.6},
  {w:'ちんうんち', kind:'risky', wt:0.6},
  {w:'うんこちん', kind:'risky', wt:0.6},
  {w:'ちんこちん', kind:'risky', wt:0.6},
  // --- 4文字 ---
  {w:'ちんちん',   kind:'risky', wt:1.0},
  {w:'うんちん',   kind:'risky', wt:1.0},
  // --- 3文字（偶然でもよく揃うので、出しすぎないよう重みで調整）---
  {w:'うんこ',     kind:'risky', wt:1.6},
  {w:'うんち',     kind:'risky', wt:1.6},
  {w:'ちんこ',     kind:'risky', wt:1.0},
];
const WORDS_S=[...WORDS].sort((a,b)=>b.w.length-a.w.length);
const RISKY_W=WORDS.filter(x=>x.kind==='risky');
function pickRisky(){
  const tot=RISKY_W.reduce((a,x)=>a+x.wt,0);
  let r=Math.random()*tot;
  for(const x of RISKY_W){ r-=x.wt; if(r<=0) return x; }
  return RISKY_W[0];
}
function charCat(c){ return c==='す' ? 'happy' : 'mid'; }   // す＝ちんすこう専用の文字
const NREEL=5, VIS=3, STRIP=20;                 // CELL は layout() が実測して決める
/* 表示は窓を基準にした符号付き距離 d=(k-pos mod N)-ROW0 で置くので、
   最上段に見えているコマ番号は (pos+ROW0) になる。判定も必ずこの対応で読む。 */
const ROW0=STRIP/2;
let CELL=76;
const BASE_SPEED=15;                           // 文字/秒
const stopDelay=[0.75,1.25,1.75,2.30,2.95];    // 自動停止（左から）

const $=s=>document.querySelector(s);
const reelsEl=$('#reels'), bigsvg=$('#bigsvg'), bt1=$('#bt1');

/* ---------------- 状態 ---------------- */
let reels=[];
let spinning=false;
let state={made:0,risk:0,coin:100};
let outcome=null;
let stoppedCount=0;
let reachOn=false, drumTimer=null;

/* ---------------- 文字タイル ---------------- */
const _tbl=REEL_SPEC.map(spec=>{
  const out=[];
  for(const k in spec) out.push([k,spec[k]]);
  return {out:out, tot:out.reduce((a,o)=>a+o[1],0)};
});
function randChar(i){
  const t=_tbl[i]; let r=Math.random()*t.tot;
  for(const o of t.out){ r-=o[1]; if(r<=0) return o[0]; }
  return t.out[0][0];
}
function makeTile(ch){
  const d=document.createElement('div');
  d.className='cell k';
  d.dataset.ch=ch;
  d.innerHTML='<div class="tile '+charCat(ch)+'" style="background:'+(CHAR_BG[ch]||'')+'">'+
              '<span class="kana">'+ch+'</span></div>';
  return d;
}

/* ---------------- リール生成 ---------------- */
function buildReels(){
  const line=$('#line'), run=$('#runline');
  reelsEl.innerHTML='';
  for(let i=0;i<NREEL;i++){
    const r=document.createElement('div');
    r.className='reel';
    const strip=document.createElement('div');
    strip.className='strip';
    for(let k=0;k<STRIP;k++) strip.appendChild(makeTile(randChar(i)));
    r.appendChild(strip);
    reelsEl.appendChild(r);
    reels.push({el:r,strip:strip,pos:0,vel:0,spinning:false,stopAt:0,stopping:false,
                from:0,to:0,t0:0,dur:0,landed:false,cells:[...strip.children]});
    // 初期表示はバラバラに見えるよう少しずらす（コマ境界に合わせるので絵は欠けない）
    reels[i].pos = Math.floor(Math.random()*STRIP);
  }
  if(line) reelsEl.appendChild(line);      // 当たり枠はリールの上に重ねる
  if(run)  reelsEl.appendChild(run);
  render(true);
}
/* コマを1枚ずつ循環配置する。pos は「最上段のコマ番号」（端数＝スクロール中）。
   帯を1本スクロールさせる方式だと帯の端でコマが窓から外れて空白になるため、常に全コマを円環で配置する。 */
function render(unblur){
  const H=ROW0, NEAR=4;                    // 窓の外±2コマぶんだけ位置を更新すれば足りる
  for(let ri=0;ri<reels.length;ri++){
    const r=reels[ri];
    for(let k=0;k<STRIP;k++){
      // 窓(0〜3コマ)を基準にした符号付き距離。±STRIP/2 で折り返すので画面内で飛ばない
      const d=((((k-r.pos)%STRIP)+STRIP)%STRIP)-H;
      const c=r.cells[k];
      if(d<-NEAR||d>NEAR){
        // 窓から外れたら中身を新しい文字に入れ替える（固定だと幸運な並びが何度も当たる）
        // ただし今回の当たりで仕込んだコマは入れ替えない
        if(c.dataset.away!=='1'){
          c.dataset.away='1';
          if(k===r.rigIdx) continue;
          const ch=randChar(ri);
          c.dataset.ch=ch;
          const tile=c.firstChild;
          tile.className='tile '+charCat(ch);
          tile.style.background=CHAR_BG[ch]||'';
          tile.firstChild.textContent=ch;
        }
        continue;
      }
      c.dataset.away='';
      const y=Math.round(d*CELL);
      if(c.dataset.y!==String(y)){ c.style.transform='translateY('+y+'px)'; c.dataset.y=String(y); }
    }
    if(!unblur) r.el.classList.toggle('spinning', r.spinning||r.stopping);
  }
}

/* ---------------- 抽選（言葉を決めてから止める） ---------------- */
function decide(){
  const r=Math.random();
  let W=null;
  if(r<0.15) W=WORDS[0];          // ちんすこう（レインボー）
  else if(r<0.42) W=pickRisky();  // ヤバい言葉（重み付きで偏らないように）
  if(!W) return null;
  return {word:W.w, len:W.w.length, start:0, row:1, kind:W.kind};
}
function plannedChar(i){
  if(!outcome) return null;
  return (i>=outcome.start && i<outcome.start+outcome.len) ? outcome.word[i-outcome.start] : null;
}
/* まだ停止していないリールに言葉が残っているか（リーチ判定） */
function canReach(){
  return WORDS.some(W=>{
    for(let s=0;s+W.w.length<=5;s++){
      let ok=true;
      for(let k=0;k<W.w.length;k++){
        if(s+k>=stoppedCount) continue;                 // 未停止リールは任意
        if(charAt(reels[s+k],0)!==W.w[k]){ ok=false; break; }
      }
      if(ok) return true;
    }
    return false;
  });
}

/* 大演出を消す（次の回転でも呼ぶ）。SVG要素は className= が効かないので setAttribute を使う */
function clearBig(){
  clearTimeout(bigTimer);
  bigsvg.setAttribute('class','');
  $('#banner').classList.remove('on');
  $('#line').className='';
}
/* ---------------- 回転 ---------------- */
function startSpin(dir){
  if(spinning) return;
  clearBig();
  spinning=true; stoppedCount=0; reachOn=false;
  $('#reach').classList.remove('on');
  $('#runline').classList.add('on');
  $('#lever').disabled=true;
  msg('ちんすこう つくってる…','');
  outcome = FORCE_MODE ? FORCE_MODE : decide();
  audio.spin();
  const d=(dir===undefined?-1:dir);   // -1 = 図柄が上へ流れる（下フリック）
  reels.forEach((r,i)=>{
    r.spinning=true; r.stopping=false; r.landed=false; r.rigIdx=-1;
    r.vel=BASE_SPEED*(0.92+Math.random()*0.16)*d;
    r.pos=Math.round(r.pos*2)/2;
    r.stopAt=simT+stopDelay[i]*(0.9+Math.random()*0.2);
  });
  navigator.vibrate && navigator.vibrate([12,40,12]);
}
function stopReel(r){
  if(!r.spinning||r.stopping) return;
  const i=reels.indexOf(r);
  r.spinning=false; r.stopping=true;
  const v=Math.abs(r.vel)||BASE_SPEED;
  const dirSign=r.vel>=0?1:-1;
  r.dur=0.42+Math.random()*0.22;
  // 停止目標：整数位置。止まるまでのコマ数をランダムにしないと毎回同じ場所に止まって出目が固定される
  const dist=6+Math.round(Math.random()*10);
  r.from=r.pos;
  r.to=Math.round(r.from)+dirSign*dist;
  r.t0=simT;
  r.vel=0;
  // 着地文字を仕込む（中央行に見えるコマ＝cellIndex(row=1)）
  const want=plannedChar(i);
  if(want){
    const idx=cellIndex({pos:Math.round(r.to)},1);
    r.rigIdx=idx;                                  // 入れ替え対象から外す
    r.strip.replaceChild(makeTile(want), r.strip.children[idx]);
    r.cells=[...r.strip.children];
  }
  audio.stop();
  stoppedCount++;
  // リーチ判定（2リール停止の時点で、まだ言葉が残っているか）
  if(stoppedCount===2 && canReach()){
    reachOn=true;
    $('#reach').classList.add('on');
    $('#runline').classList.add('on');
    msg(outcome&&outcome.kind==='risky' ? '…なにか来ますよ' : '…きますよ', '');
    drumroll(true);
    // リーチで遅延（期待感）
    reels.forEach((rr,k)=>{ if(k>=2) rr.stopAt=simT+(k-1)*0.55+0.35; });
  }
}
function finishSpin(){
  spinning=false; stoppedCount=0;
  $('#lever').disabled=false;
  $('#runline').classList.remove('on');
  drumroll(false);
  if(reachOn){ $('#reach').classList.remove('on'); reachOn=false; }
  judge();
}

/* ---------------- 判定（揃った言葉を探す） ---------------- */
/* 画面に見えているコマ番号を返す（表示と同じ対応にすること！） */
function cellIndex(r,row){ return (((Math.round(r.pos)+row+ROW0)%STRIP)+STRIP)%STRIP; }
function charAt(r,row){ return r.cells[cellIndex(r,row)].dataset.ch; }
function rowChars(row){ return reels.map(r=>charAt(r,row)); }

function judge(){
  let best=null;
  for(let row=0;row<3;row++){
    const chars=rowChars(row);
    for(let s=0;s<5;s++){
      for(const W of WORDS_S){
        const L=W.w.length;
        if(s+L>5) continue;
        if(chars.slice(s,s+L).join('')!==W.w) continue;
        const score=(W.kind==='happy'?100:0)+L*4+(row===1?2:0);
        if(!best||score>best.score) best={word:W.w,kind:W.kind,len:L,start:s,row:row,score:score};
      }
    }
  }
  if(!best){ nearMiss(); return; }
  showLine(best);
  if(best.kind==='happy') happyHit(best); else riskyHit(best);
}

/* 揃わなかったとき：惜しい演出 */
function nearMiss(){
  let n0=0,w0='',row0=1,s0=0;
  for(let row=0;row<3;row++){
    const chars=rowChars(row);
    for(const W of WORDS){
      for(let s=0;s<5;s++){
        let n=0;
        while(s+n<5 && n<W.w.length && chars[s+n]===W.w[n]) n++;
        if(n>n0){ n0=n; w0=W.w; row0=row; s0=s; }
      }
    }
  }
  if(n0>=2){
    if(n0>=3){ state.coin+=30; animCount($('#sCoin'),state.coin); }
    showLine({row:row0,start:s0,len:n0,kind:'normal'},true);
    msg('<span class="hlr">おしい！！</span>「'+w0.slice(0,n0)+'」…あと'+(w0.length-n0)+'もじ', '');
    audio.small();
  }else{
    msg('はずれ…もういっかい！','');
    audio.miss();
  }
}

/* 当たり位置を四角で囲む */
function showLine(h,tmp){
  const line=$('#line');
  const a=reels[h.start].el, b=reels[h.start+h.len-1].el;
  line.style.left=a.offsetLeft+'px';
  line.style.width=(b.offsetLeft+b.offsetWidth-a.offsetLeft)+'px';
  line.style.top=(h.row*CELL)+'px';
  line.style.height=CELL+'px';
  line.className='';
  line.classList.add('on');
  if(h.kind==='risky') line.classList.add('risk');
  if(h.kind==='normal') line.classList.add('normal');
  clearTimeout(showLine._t);
  if(tmp) showLine._t=setTimeout(()=>{ line.className=''; },1600);
}

/* ---------------- 表示ヘルパ ---------------- */
function msg(html,cls){
  const m=$('#msg');
  m.innerHTML = cls?('<span class="'+cls+'">'+html+'</span>'):html;
}
function animCount(el,to){
  const from=parseInt(el.textContent.replace(/,/g,''))||0;
  const t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/650);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))).toLocaleString();
    if(k<1) requestAnimationFrame(step); else el.textContent=to.toLocaleString();
  })(t0);
  setTimeout(()=>{ el.textContent=to.toLocaleString(); },760);   // rAFが止まる環境でも確定させる
}
function riskPeek(){
  animCount($('#sRisk'), state.risk);

/* ---------------- 大文字（SVG / レインボー縁・金縁） ---------------- */
let bigTimer=null;
const SVGNS='http://www.w3.org/2000/svg';
function bigTextEl(line,y,size){
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('text-anchor','middle'); t.setAttribute('x','500');
  t.setAttribute('y',y.toFixed(1)); t.setAttribute('font-size',size.toFixed(1));
  t.textContent=line; return t;
}
function showBig(txt, grad, opt){
  opt=opt||{};
  const lines=txt.split('\n');
  const G=$('#bigG');
  // 1) 文字幅を実測し、行数に応じた描画領域に収まるサイズを決める（上下が欠けないように）
  const probe=document.createElementNS(SVGNS,'text');
  probe.setAttribute('font-size','200'); probe.setAttribute('text-anchor','middle');
  let maxw=1;
  for(const l of lines){ probe.textContent=l; G.appendChild(probe); maxw=Math.max(maxw,probe.getComputedTextLength()); G.removeChild(probe); }
  const size=Math.max(60, Math.min(340, 200*940/maxw));
  const lineH=size*1.04;
  const n=lines.length;
  const VB_H=Math.round(size*(1+(n-1)*1.04)+size*0.5);   // グリフ＋縁の太さぶんの余白
  bigsvg.setAttribute('viewBox','0 0 1000 '+VB_H);
  const cy=VB_H/2;
  const y0=cy-(n-1)*lineH/2;
  G.innerHTML='';
  // 2) 奥に暗い縁（外側のフチ）→ 手前に金/レインボーの縁 + 白抜き
  lines.forEach((l,i)=>{                     // back layer
    const t=bigTextEl(l, y0+i*lineH+size*0.36, size);
    t.setAttribute('fill','none');
    t.setAttribute('stroke', grad==='au' ? '#400f00' : '#1a0033');
    t.setAttribute('stroke-width',(size*0.30).toFixed(1));
    G.appendChild(t);
  });
  lines.forEach((l,i)=>{                     // front layer
    const t=bigTextEl(l, y0+i*lineH+size*0.36, size);
    t.setAttribute('fill', grad==='au' ? '#fffbe8' : '#ffffff');
    t.setAttribute('stroke','url(#'+grad+')');
    t.setAttribute('stroke-width',(size*0.175).toFixed(1));
    G.appendChild(t);
  });
  bigsvg.setAttribute('class','');        // SVG は className= では消えない
  bigsvg.classList.add(grad);
  if(opt.strobe) bigsvg.classList.add('strobe');
  void bigsvg.offsetWidth;
  bigsvg.classList.add('show');
  clearTimeout(bigTimer);
  bigTimer=setTimeout(()=>{
    bigsvg.classList.remove('show'); bigsvg.classList.add('hide');
    setTimeout(()=>bigsvg.classList.remove('hide'),450);
  }, 2600);
}

/* ---------------- 紙吹雪・金粉パーティクル ---------------- */
const cv=$('#fx'), ctx=cv.getContext('2d');
let parts=[], dpr=Math.min(3,window.devicePixelRatio||1);
function sizeCanvas(){
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
sizeCanvas(); addEventListener('resize',sizeCanvas);
const RB_COLORS=['#ff004d','#ff8a00','#ffe600','#25ff64','#00e5ff','#4d5bff','#c400ff','#ff2ea6'];
function confetti(n,kind){
  for(let i=0;i<n;i++){
    const fromLeft=Math.random()<0.5;
    parts.push({
      x: fromLeft? -20 : innerWidth+20,
      y: innerHeight*(0.35+Math.random()*0.5),
      vx: (fromLeft?1:-1)*(5+Math.random()*13),
      vy: -(6+Math.random()*13),
      g: 0.32+Math.random()*0.2,
      r: kind==='gold' ? (Math.random()<0.5?8:4) : 5+Math.random()*7,
      col: kind==='gold'
            ? ['#fff7c0','#ffd700','#ffae00','#fff','#b8860b'][(Math.random()*5)|0]
            : RB_COLORS[(Math.random()*RB_COLORS.length)|0],
      rot: Math.random()*6.28, vr:(Math.random()-.5)*0.4,
      life: 90+Math.random()*70, age:0,
      star: kind==='gold' && Math.random()<0.45,
      wob: Math.random()*6.28
    });
  }
  if(!rafOn) loopFX();
}
let rafOn=false, lastFX=0;
function fxStep(dt){
  const K=dt*60;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.age+=K; p.wob+=0.2*K;
    p.vy+=p.g*K; p.x+=p.vx*K; p.y+=p.vy*K; p.vx*=Math.pow(0.992,K); p.rot+=p.vr*K;
    if(p.age>p.life || p.y>innerHeight+60){ parts.splice(i,1); continue; }
    const a=Math.max(0,1-p.age/p.life);
    ctx.globalAlpha=a; ctx.fillStyle=p.col;
    if(p.star){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r*2.2,-p.r*0.3,p.r*4.4,p.r*0.6);
      ctx.fillRect(-p.r*0.3,-p.r*2.2,p.r*0.6,p.r*4.4); ctx.restore();
    }else{
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore();
    }
  }
  ctx.globalAlpha=1;
  if(!parts.length){ ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function loopFX(){
  if(rafOn) return;
  rafOn=true; lastFX=performance.now()/1000;
  (function f(){
    const now=performance.now()/1000;
    const dt=Math.min(0.05,now-lastFX); lastFX=now;
    if(!manual) fxStep(dt);
    if(parts.length && !manual) requestAnimationFrame(f);
    else rafOn=false;
  })();
}

/* ---------------- 音（WebAudio 合成・素材なし） ---------------- */
const audio={
  on:true, ac:null,
  ctx(){ if(!this.ac){ try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return this.ac; },
  tone(f,dur,type,gain,delay,slideTo){
    if(!this.on) return; const ac=this.ctx(); if(!ac) return;
    const t=ac.currentTime+(delay||0);
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain||0.07,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  },
  spin(){ this.tone(180,0.12,'sawtooth',0.05,0,520); this.tone(340,0.09,'square',0.03,0.03,760); },
  stop(){ this.tone(880,0.07,'square',0.06,0,440); this.tone(1200,0.05,'triangle',0.04,0.02); },
  small(){ [660,880,1180].forEach((f,i)=>this.tone(f,0.12,'square',0.05,i*0.07)); },
  miss(){ this.tone(220,0.18,'sine',0.04,0,150); },
  fanfare(lv){
    const seq = lv? [523,659,784,1047,1319,1568,2093] : [523,659,784,1047,1319];
    seq.forEach((f,i)=>this.tone(f,0.3,'square',0.075,i*0.1));
    if(lv) seq.forEach((f,i)=>this.tone(f*2,0.25,'triangle',0.04,i*0.1+0.02));
    const n=this.ctx(); if(n){ for(let i=0;i<10;i++) this.tone(RBf(i*2),0.12,'triangle',0.05,1.0+i*0.09); }
  },
  siren(big){
    const n=big?8:4;
    for(let i=0;i<n;i++){ this.tone(900,0.16,'sawtooth',0.06,i*0.19,380); this.tone(380,0.16,'sawtooth',0.05,i*0.19+0.16,900); }
    if(big) for(let i=0;i<6;i++) this.tone(120,0.4,'square',0.05,i*0.3);
  }
};
function RBf(i){ return 440*Math.pow(2,i/12); }
function drumroll(on){
  clearInterval(drumTimer);
  if(!on||!audio.on) return;
  drumTimer=setInterval(()=>{ audio.tone(150+Math.random()*60,0.05,'square',0.04); },70);
}

/* ---------------- 入力（フリック / タップ / レバー） ---------------- */
let drag=null, lastTouch=0;
function onDown(e){
  if(e.type==='mousedown' && performance.now()-lastTouch<900) return;   // タッチ後の合成mouseを無視
  if(e.type==='touchstart') lastTouch=performance.now();
  const p=pt(e);
  drag={x:p.x,y:p.y,y0:p.y,t:performance.now(),moved:false,vy:0,lastY:p.y,lastT:performance.now(),dir:0};
  audio.ctx();   // ユーザー操作でAudioContextを解放
  if(e.cancelable) e.preventDefault();
}
function onMove(e){
  if(!drag) return;
  const p=pt(e); const dy=p.y-drag.y;
  drag.moved = drag.moved || Math.abs(dy)>8;
  const now=performance.now(); const dt=(now-drag.lastT)/1000;
  if(dt>0){ drag.vy=(p.y-drag.lastY)/dt; }
  drag.lastY=p.y; drag.lastT=now; drag.dir=Math.sign(dy);
  if(drag.moved && !spinning){
    // ドラッグ中もリールが指に追従（上→下で図柄が下へ）
    reels.forEach(r=>{ r.pos -= dy/(CELL*1.6); });
    render(true);
  }
  drag.y=p.y;
  if(e.cancelable) e.preventDefault();
}
function onUp(e){
  if(!drag) return;
  if(e.type==='touchend') lastTouch=performance.now();
  const dt=(performance.now()-drag.t)/1000;
  const dy=drag.lastY-drag.y0;
  const flicked = Math.abs(dy)>24 && dt<0.5;
  const vy=drag.vy;
  if(spinning){
    if(!drag.moved) stopReel(reels.find(r=>r.spinning)||reels[0]);   // タップで目押し停止
  }else if(flicked||!drag.moved){
    startSpin(vy>0?1:-1);
  }
  drag=null;
}
function pt(e){
  if(e.touches&&e.touches[0]) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}
const area=$('#machine');
area.addEventListener('touchstart',onDown,{passive:false});
area.addEventListener('touchmove',onMove,{passive:false});
area.addEventListener('touchend',onUp);
area.addEventListener('touchcancel',()=>{drag=null;});
area.addEventListener('mousedown',onDown);
addEventListener('mousemove',onMove);
addEventListener('mouseup',onUp);
$('#lever').addEventListener('click',()=>{ audio.ctx(); if(spinning) reels.find(r=>r.spinning)&&stopReel(reels.find(r=>r.spinning)); else startSpin(-1); });
$('#mute').addEventListener('click',()=>{ audio.on=!audio.on; $('#mute').textContent=audio.on?'🔊':'🔇'; if(!audio.on) drumroll(false); });

/* ---------------- メインループ（simT = シミュレーション時刻） ---------------- */
let simT=0, last=performance.now()/1000, manual=false;
function step(dt){
  simT+=dt;
  let allDone=true;
  for(const r of reels){
    if(r.stopping){
      const k=Math.min(1,(simT-r.t0)/r.dur);
      const e=1-Math.pow(1-k,4);          // easeOutQuart
      r.pos=r.from+(r.to-r.from)*e;
      if(k>=1){ r.pos=r.to; r.stopping=false; r.landed=true; }
      allDone=false;
    }else if(r.spinning){
      if(simT>=r.stopAt) stopReel(r);
      else r.pos+=r.vel*dt;
      allDone=false;
    }
  }
  render();
  if(spinning && allDone) finishSpin();
}
function loop(){
  const now=performance.now()/1000;
  const dt=Math.min(0.05,now-last); last=now;
  if(!manual) step(dt);
  requestAnimationFrame(loop);
}
buildReels(); requestAnimationFrame(loop);

/* ---------------- 画面サイズに合わせて1コマの高さを決める ---------------- */
function layout(){
  const mh=$('#machine').clientHeight;
  CELL=Math.max(58,Math.min(140,Math.floor((mh-58)/3)));
  document.documentElement.style.setProperty('--cellh',CELL+'px');
  render(true);
}
layout();
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,300));

/* ---------------- テスト用フック ---------------- */
const qs=new URLSearchParams(location.search);
let FORCE_MODE=null;
function buildOrder(t){
  if(!t||t==='none') return {word:'',len:0,start:0,row:1,kind:'none'};   // 抽選なし＝偶然まかせ
  if(t.indexOf(':')>0){                       // 例: word:<語>
    const w=decodeURIComponent(t.split(':')[1]);
    const K=WORDS.find(x=>x.w===w);
    if(K) return {word:w,len:w.length,start:0,row:1,kind:K.kind};
    return null;
  }
  if(t==='chinsuko') return {word:'ちんすこう',len:5,start:0,row:1,kind:'happy'};
  if(t==='risky5') return {word:'ちんちんこ',len:5,start:0,row:1,kind:'risky'};
  const K=WORDS.find(x=>x.w===t);
  return K ? {word:K.w,len:K.w.length,start:0,row:1,kind:K.kind} : null;
}
window.__slot={
  simT:()=>simT,
  // 当選を固定してシミュレーション時間を進める（画面のない検証環境でも演出を再現できる）
  play(t,secs){
    manual=true;
    // 途中回転が残っていても確実に仕切り直す（検証用）
    spinning=false;
    reels.forEach(r=>{ r.spinning=false; r.stopping=false; r.vel=0; });
    FORCE_MODE=buildOrder(t);
    startSpin(-1);
    FORCE_MODE=null;
    this.tick(secs===undefined?7:secs);
    manual=false;
    return this.state();
  },
  tick(secs){
    const n=Math.round(secs*60);
    for(let i=0;i<n;i++){ step(1/60); if(parts.length) fxStep(1/60); }
    return simT;
  },
  state(){
    return {spinning:spinning, simT:simT,
            rows:[0,1,2].map(r=>rowChars(r)),
            center:rowChars(1),
            want:outcome?outcome.word+'@'+outcome.row:null,
            made:state.made, risk:state.risk, coin:state.coin,
            msg:$('#msg').textContent, big:bigsvg.getAttribute('class'), bigtext:$('#bigG').textContent,
            reach:$('#reach').className, line:$('#line').className};
  }
};
if(qs.get('t')){                       // 例: index.html?t=word:<語>
  FORCE_MODE=buildOrder(qs.get('t'));
  setTimeout(()=>{
    startSpin(-1);
    FORCE_MODE=null;
    manual=true;
    for(let i=0;i<420;i++){ step(1/60); if(parts.length) fxStep(1/60); }
    manual=false;
  },80);
}
</script>
